<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration — Jadara Clearance System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Student Registration</h1>
                <p>Create your clearance system account</p>
            </div>

            <div id="registerAlert" class="alert alert-danger"></div>

            <form id="registerForm" action="javascript:void(0);" onsubmit="return false;" novalidate>
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" class="form-control" placeholder="John Doe" required>
                    <div class="invalid-feedback">Full Name is required.</div>
                </div>

                <div class="form-group">
                    <label for="email">University Email</label>
                    <input type="email" id="email" class="form-control" placeholder="student@jadara.edu" required>
                    <div class="invalid-feedback">Please enter a valid email address.</div>
                </div>

                <div class="form-group">
                    <label for="universityId">University ID</label>
                    <input type="text" id="universityId" class="form-control" placeholder="20241001" required>
                    <div class="invalid-feedback">University ID is required.</div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="At least 6 characters" required>
                    <div class="invalid-feedback">Password must be at least 6 characters.</div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" class="form-control" placeholder="Repeat password" required>
                    <div class="invalid-feedback">Passwords do not match.</div>
                </div>

                <button type="submit" id="registerSubmitBtn" class="btn btn-primary btn-block">
                    Register Account
                </button>
            </form>

            <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
                <span style="color: var(--color-text-muted);">Already have an account?</span>
                <a href="index.html" style="color: var(--color-primary); font-weight: 600; text-decoration: none; margin-left: 0.25rem;">
                    Login here
                </a>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/guard.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
